name: vme-insight

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vme
      POSTGRES_USER: vme
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TS_TUNE_MEMORY: ${DB_MEMORY:-1GB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:                     # uncomment to reach the database from the host
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vme -d vme"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    image: vme-insight-collector:latest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vme:${DB_PASSWORD}@timescaledb:5432/vme
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config-src:ro   # copied to a private /config by the entrypoint
      - ./probe:/probe
      - prom-targets:/targets

  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
      - prom-targets:/targets:ro
    # ports:                     # uncomment to open the Prometheus UI from the host
    #   - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - collector
      - prometheus
    ports:
      # GRAFANA_BIND=127.0.0.1 leaves the https proxy (below) as the only way in from other machines
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Treemap panel (Grafana Labs, signed) for the VM resource-weight panels, pinned. Downloaded from
      # grafana.com on first start; for offline hosts see docs/INSTALL.md "Offline installs".
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS-marcusolsson-treemap-panel 2.1.1}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      # Anonymous read-only access, e.g. for the VME UI plugin. Restrict who can reach Grafana first.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_NAME: ${GRAFANA_ANONYMOUS_ORG:-Main Org.}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vme-overview.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Optional: https in front of Grafana, limited to HTTPS_ALLOW networks. Needed to embed
  # Grafana in https pages such as VME. Start with:
  #   docker compose --profile https up -d https
  https:
    image: caddy:2.8.4-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      - "${HTTPS_PORT:-3443}:443"
    environment:
      HTTPS_HOSTNAME: ${HTTPS_HOSTNAME:-localhost}
      HTTPS_ALLOW: ${HTTPS_ALLOW:-127.0.0.1/32}
      HTTPS_TLS: ${HTTPS_TLS:-internal}
      HTTPS_LOG_LEVEL: ${HTTPS_LOG_LEVEL:-INFO}
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./https/certs:/certs:ro
      - https-data:/data

  # Optional: serves tools/install-exporters.sh to HVM hosts. Start with:
  #   docker compose --profile installer up -d installer
  installer:
    image: caddy:2.8.4-alpine
    profiles: [installer]
    restart: unless-stopped
    ports:
      - "${INSTALLER_PORT:-8097}:8080"
    volumes:
      - ./installer/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tools/install-exporters.sh:/srv/install-exporters.sh:ro
      - ./installer/dist:/srv/dist:ro

volumes:
  db-data:
  grafana-data:
  prom-data:
  prom-targets:
  https-data:
