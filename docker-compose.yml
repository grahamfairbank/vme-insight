name: vme-insight

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vme
      POSTGRES_USER: vme
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TS_TUNE_MEMORY: ${DB_MEMORY:-1GB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:                     # uncomment to reach the database from the host
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vme -d vme"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    image: vme-insight-collector:latest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vme:${DB_PASSWORD}@timescaledb:5432/vme
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config:ro
      - ./probe:/probe
      - prom-targets:/targets

  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
      - prom-targets:/targets:ro
    # ports:                     # uncomment to open the Prometheus UI from the host
    #   - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - collector
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vme-overview.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Optional: serves tools/install-exporters.sh to HVM hosts. Start with:
  #   docker compose --profile installer up -d installer
  installer:
    image: caddy:2.8.4-alpine
    profiles: [installer]
    restart: unless-stopped
    ports:
      - "${INSTALLER_PORT:-8097}:8080"
    volumes:
      - ./installer/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tools/install-exporters.sh:/srv/install-exporters.sh:ro
      - ./installer/dist:/srv/dist:ro

volumes:
  db-data:
  grafana-data:
  prom-data:
  prom-targets:
